<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirection...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #0f172a;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 400px;
      padding: 32px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      border: 1px solid #e2e8f0;
    }
    .spinner {
      border: 3px solid #f1f5f9;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #000000;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 12px 0;
    }
    p {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      color: white;
      padding: 12px 24px;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      width: 100%;
      box-sizing: border-box;
    }
    .btn:hover {
      background-color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Connexion réussie</h1>
    <p>Nous vous redirigeons vers l'application MyCityUnlocked. Si la redirection ne démarre pas automatiquement, cliquez sur le bouton ci-dessous.</p>
    <a id="fallback-link" href="#" class="btn">Ouvrir l'application</a>
  </div>

  <script>
    // Get hash or search query params containing auth session details from Supabase
    const hash = window.location.hash || '';
    const search = window.location.search || '';
    const targetUrl = 'mycityunlocked://home' + search + hash;

    // Update button link
    document.getElementById('fallback-link').href = targetUrl;

    // Immediately trigger redirect via client-side GET navigation
    window.location.href = targetUrl;

    // Safety fallback trigger
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 500);
  </script>
</body>
</html>

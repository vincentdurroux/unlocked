    <script>
      (function() {
        window.__mcuEarlyPushQueue = window.__mcuEarlyPushQueue || [];
        var pushNative = function(kind, payload) {
          try {
            if (typeof window.__mcuOneSignalDispatch === 'function') {
              window.__mcuOneSignalDispatch(kind, payload);
            } else {
              window.__mcuEarlyPushQueue.push({ kind: kind, payload: payload, ts: Date.now() });
            }
          } catch (_) {}
        };
        window.gonative_onesignal_push_opened = function(p) { pushNative('push', p); };
        window.median_onesignal_push_opened = function(p) { pushNative('push', p); };
        window.handleOneSignalNotificationOpened = function(p) { pushNative('push', p); };
        window.handleUniversalLink = function(u) { pushNative('deeplink', u); };
        window.handleDeepLink = function(u) { pushNative('deeplink', u); };
        var bindNativeEvent = function(eventName, kind) {
          var handler = function(e) {
            if (e && e.__mcuPushHandled) return;
            if (e) {
              try { e.__mcuPushHandled = true; } catch (_) {}
            }
            pushNative(kind, e && e.detail !== undefined ? e.detail : e);
          };
          window.addEventListener(eventName, handler);
          document.addEventListener(eventName, handler);
        };
        bindNativeEvent('onesignal-notification-opened', 'push');
        bindNativeEvent('push-notification-click', 'push');
        bindNativeEvent('push-notification-clicked', 'push');
        bindNativeEvent('universal-link-opened', 'deeplink');
        var handlePermissionState = function(e) {
          if (e && e.__mcuPushStateHandled) return;
          if (e) {
            try { e.__mcuPushStateHandled = true; } catch (_) {}
          }
          var detail = e && e.detail !== undefined ? e.detail : e;
          window.__mcuLastPushPermissionState = detail;
          if (typeof window.__mcuOnPushPermissionState === 'function') {
            try { window.__mcuOnPushPermissionState(detail); } catch (_) {}
          }
        };
        window.addEventListener('push-permission-state', handlePermissionState);
        document.addEventListener('push-permission-state', handlePermissionState);
      })();
    </script>
    <!-- OneSignal Web SDK v16 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          var configuredAppId = "%NEXT_PUBLIC_ONESIGNAL_APP_ID%";
          if (!configuredAppId || configuredAppId.indexOf("%") !== -1) {
            configuredAppId = "10a14311-a42a-4681-9682-ce965d80ae75";
          }
          var hostname = window.location.hostname;
          var isDefaultAppId = configuredAppId === "10a14311-a42a-4681-9682-ce965d80ae75";
          var isAllowedDomain = hostname.endsWith('mycityunlocked.app') || 
                                hostname === 'localhost' || 
                                hostname === '127.0.0.1';

          // Prevent OneSignal SDK from throwing domain mismatch error on dev / preview domains
          if (isDefaultAppId && !isAllowedDomain) {
            console.info('[OneSignal] Skipping init: default App ID is registered for https://mycityunlocked.app (current host: ' + hostname + ')');
            return;
          }

          await OneSignal.init({
            appId: configuredAppId,
            allowLocalhostAsSecureOrigin: true,
            serviceWorkerPath: "OneSignalSDKWorker.js",
            serviceWorkerParam: { scope: "/" }
          });
        } catch (err) {
          console.warn('[OneSignal] Deferred init notice:', err && err.message ? err.message : err);
        }
      });
    </script>

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/OneSignalSDKWorker.js', { scope: '/' })
            .then((reg) => console.log('[Service Worker] Registered successfully:', reg.scope))
            .catch((err) => console.error('[Service Worker] Registration failed:', err));
        });
      }
    </script>

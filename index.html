<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="apple-itunes-app" content="app-id=6780855463">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo2.png" />
    <link rel="icon" type="image/png" href="/logo2.png" />
    <link rel="preload" as="image" href="/people.png" fetchpriority="high" />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.onesignal.com" />
    <meta name="apple-mobile-web-app-title" content="Unlocked" />
    <title>Unlocked</title>
    <!-- OneSignal Web SDK v16 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          var configuredAppId = "%NEXT_PUBLIC_ONESIGNAL_APP_ID%";
          if (!configuredAppId || configuredAppId.indexOf("%") !== -1) {
            configuredAppId = "10a14311-a42a-4681-9682-ce965d80ae75";
          }
          var hostname = window.location.hostname;
          var isDefaultAppId = configuredAppId === "10a14311-a42a-4681-9682-ce965d80ae75";
          var isAllowedDomain = hostname.endsWith('mycityunlocked.app') || 
                                hostname === 'localhost' || 
                                hostname === '127.0.0.1';

          // Prevent OneSignal SDK from throwing domain mismatch error on dev / preview domains
          if (isDefaultAppId && !isAllowedDomain) {
            console.info('[OneSignal] Skipping init: default App ID is registered for https://mycityunlocked.app (current host: ' + hostname + ')');
            return;
          }

          await OneSignal.init({
            appId: configuredAppId,
            allowLocalhostAsSecureOrigin: true,
            serviceWorkerPath: "OneSignalSDKWorker.js",
            serviceWorkerParam: { scope: "/" }
          });
        } catch (err) {
          console.warn('[OneSignal] Deferred init notice:', err && err.message ? err.message : err);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/OneSignalSDKWorker.js', { scope: '/' })
            .then((reg) => console.log('[Service Worker] Registered successfully:', reg.scope))
            .catch((err) => console.error('[Service Worker] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
